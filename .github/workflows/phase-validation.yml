name: KTV Phase Validation

on:
  push:
    branches: [feat/ktv-*]
  pull_request:
    branches: [feat/ktv-*]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Production web build
        run: yarn build
      - name: KTV source formatting
        run: >-
          ./node_modules/.bin/prettier --check
          src/utils/lyricsSettings.js src/views/lyrics.vue src/views/settings.vue
          src/views/karaoke.vue src/views/karaokeRemote.vue src/App.vue
      - name: KTV source lint
        run: >-
          ./node_modules/.bin/eslint
          src/utils/lyricsSettings.js src/views/lyrics.vue src/views/settings.vue
          src/views/karaoke.vue src/views/karaokeRemote.vue src/App.vue
      - name: Full repository lint diagnostic (known upstream failures)
        continue-on-error: true
        run: yarn lint

