name: KTV Packaging Validation

on:
  push:
    branches: [fix/ktv-release-stabilization]
  pull_request:
    branches: [fix/ktv-release-stabilization]
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            command: electron:build-win
            artifact: dist_electron/*.exe
          - os: macos-13
            name: macos-x64
            command: electron:build-mac-x64
            artifact: dist_electron/*-x64.dmg
          - os: macos-14
            name: macos-arm64
            command: electron:build-mac-arm64
            artifact: dist_electron/*-arm64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Build packaged application
        shell: bash
        run: yarn ${{ matrix.command }}
      - name: Verify packaged output exists
        shell: bash
        run: |
          shopt -s nullglob
          files=( ${{ matrix.artifact }} )
          test "${#files[@]}" -gt 0
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: yesplaymusic-ktv-${{ matrix.name }}
          path: ${{ matrix.artifact }}
