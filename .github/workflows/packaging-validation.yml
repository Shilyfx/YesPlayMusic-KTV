name: KTV Packaging Validation

on:
  push:
    branches: [fix/ktv-release-stabilization]
  pull_request:
    branches: [fix/ktv-release-stabilization]
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos-arm64
            command: electron:build-mac-arm64
            artifact: dist_electron/*-arm64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Install macOS ARM64 native dependencies
        shell: bash
        run: |
          unm_version=$(node -p "require('./node_modules/@unblockneteasemusic/rust-napi/package.json').version")
          yarn add --ignore-platform --ignore-optional --no-lockfile \
            "@unblockneteasemusic/rust-napi-darwin-arm64@${unm_version}" \
            dmg-license
          # The root esbuild (used by vue.config.js) and esbuild-loader may
          # resolve different versions. Give each its own matching binary.
          root_esbuild=$(node -p "require('path').dirname(require.resolve('esbuild/package.json'))")
          loader_esbuild=$(node -p "const p=require('path'); p.dirname(require.resolve('esbuild/package.json',{paths:[p.dirname(require.resolve('esbuild-loader/package.json'))]}))")
          for esbuild_dir in "$root_esbuild" "$loader_esbuild"; do
            version=$(node -p "require(process.argv[1]+'/package.json').version" "$esbuild_dir")
            archive=$(npm pack "@esbuild/darwin-arm64@${version}" --pack-destination "$RUNNER_TEMP" --silent)
            mkdir -p "$esbuild_dir/node_modules/@esbuild/darwin-arm64"
            tar -xzf "$RUNNER_TEMP/$archive" --strip-components=1 -C "$esbuild_dir/node_modules/@esbuild/darwin-arm64"
            node -e "require(process.argv[1]).transformSync('const ready = true')" "$esbuild_dir"
          done
      - name: Verify fresh anonymous-token initialization
        run: yarn test:anonymous-token
      - name: Build packaged application
        shell: bash
        env:
          LUMASING_MAC_ARCH: arm64
        run: yarn ${{ matrix.command }}
      - name: Verify ARM64 application cold start
        shell: bash
        run: |
          set -euo pipefail
          app_path=$(find dist_electron -type d -name 'LumaSing.app' -print -quit)
          test -n "$app_path"
          executable="$app_path/Contents/MacOS/LumaSing"
          test -x "$executable"
          test -f "$app_path/Contents/Info.plist"
          plutil -lint "$app_path/Contents/Info.plist"
          archs=$(lipo -archs "$executable")
          [[ " $archs " == *" arm64 "* ]]

          token_path=$(node -p "require('path').join(require('os').tmpdir(), 'anonymous_token')")
          rm -f "$token_path"
          "$executable" >"$RUNNER_TEMP/lumasing-smoke.log" 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in {1..40}; do
            if curl -fsS http://127.0.0.1:27232/__health >"$RUNNER_TEMP/lumasing-health.json"; then
              if node -e "const h=require(process.env.RUNNER_TEMP + '/lumasing-health.json'); process.exit(h.desktopServer==='ready'&&h.renderer==='ready'&&h.neteaseApi==='ready' ? 0 : 1)"; then
                ready=true
                break
              fi
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/lumasing-smoke.log"
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat "$RUNNER_TEMP/lumasing-smoke.log"
            exit 1
          fi
          node -e "const h=require(process.env.RUNNER_TEMP + '/lumasing-health.json'); console.log(h)"
          test -f "$token_path"
      - name: Verify DMG integrity and mounted architecture
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( ${{ matrix.artifact }} )
          test "${#files[@]}" -eq 1
          dmg_path="${files[0]}"
          hdiutil verify "$dmg_path"

          mount_path=$(mktemp -d)
          cleanup() {
            hdiutil detach "$mount_path" -quiet 2>/dev/null || true
            rmdir "$mount_path" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_path"
          mounted_app=$(find "$mount_path" -maxdepth 1 -type d -name 'LumaSing.app' -print -quit)
          test -n "$mounted_app"
          mounted_archs=$(lipo -archs "$mounted_app/Contents/MacOS/LumaSing")
          [[ " $mounted_archs " == *" arm64 "* ]]
          shasum -a 256 "$dmg_path" >dist_electron/LumaSing-mac-arm64.sha256
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumasing-macos-${{ matrix.name }}
          path: |
            ${{ matrix.artifact }}
            dist_electron/LumaSing-mac-arm64.sha256
          if-no-files-found: error
