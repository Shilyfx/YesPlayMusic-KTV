services:
  lumasing-api:
    image: node:22-alpine
    command: ["node", "/fixture/headers.cjs", "serve"]
    volumes:
      - ./headers.cjs:/fixture/headers.cjs:ro
    mem_limit: 64m
  web:
    image: nginx:stable-alpine
    volumes:
      - ../nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - lumasing-api
      - ktv
    mem_limit: 64m
  ktv:
    # Resolve the production nginx upstream while testing only /api/ headers.
    image: node:22-alpine
    command: ["node", "/fixture/headers.cjs", "serve"]
    volumes:
      - ./headers.cjs:/fixture/headers.cjs:ro
    mem_limit: 64m
